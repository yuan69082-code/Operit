<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>连接手机中的助手</title><style>body{font:16px/1.8 system-ui;background:#f6f3ed;color:#294438;padding:24px}h1{font-size:24px}input,button{font:inherit;border:1px solid #bed0c3;padding:10px;border-radius:10px}input{box-sizing:border-box;width:100%}button{background:#355f51;color:white;margin-top:16px}#error{color:#a33228}</style></head><body><h1>继续手机中的同一位助手</h1><p>在手机打开已有的 HTTP 服务，填写它显示的地址。连接后输入手机的访问令牌，在私聊右上角进入「私域 · 内部状态」。</p><p>聊天、候选和内部状态仍保存在手机。这不是复制助手，也不会把内容写入电脑的独立共享会话。手机服务不可用时，原数据保留。</p><form id="connect"><label>手机 HTTP 地址<input id="address" type="url" placeholder="http://192.168.1.10:8094" required></label><button id="open">连接手机</button></form><p id="error" role="alert"></p><script src="phone.js"></script></body></html>
